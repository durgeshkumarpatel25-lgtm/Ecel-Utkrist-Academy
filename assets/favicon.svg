  <text x="56" y="44" font-family="Arial, sans-serif" font-weight="900" font-size="20" fill="#0f2b66" letter-spacing="1">ECEL</text>
  <!-- Open Book at Bottom -->
  <path d="M34 76 Q42 70 50 74 Q58 70 66 76 Q58 74 50 78 Q42 74 34 76 Z" fill="#0f2b66" />
  <path d="M36 79 Q43 74 50 77 Q57 74 64 79 Q57 77 50 81 Q43 77 36 79 Z" fill="url(#goldGrad)" />
