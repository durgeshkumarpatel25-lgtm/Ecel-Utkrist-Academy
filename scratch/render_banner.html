<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Precision Banner Composer</title>
  <style>
    body {
      background: #0b1120;
      color: #ffffff;
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    #preview-canvas {
      box-shadow: 0 10px 40px rgba(0,0,0,0.7);
      background: #ffffff;
      border-radius: 8px;
    }
    .info {
      margin-top: 15px;
      font-size: 1.15rem;
      font-weight: 700;
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <h1>Rendering Precision Banner (1376 x 768)</h1>
  <canvas id="preview-canvas" width="1376" height="768"></canvas>
  <div class="info" id="status">Initializing...</div>

  <script>
    const canvas = document.getElementById('preview-canvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => resolve(img);
        img.onerror = (e) => reject(new Error('Failed to load ' + src));
        img.src = src;
      });
    }

    async function buildBanner() {
      try {
        statusEl.textContent = 'Loading source images...';
        const [baseImg, logoPng] = await Promise.all([
          loadImage('../assets/banner3.png'),
          loadImage('../assets/logo2.png')
        ]);

        // 1. Draw pristine original base image
        ctx.drawImage(baseImg, 0, 0, 1376, 768);

        // 2. Erase the old "U" logo (x: 82 to 242, y: 35 to 220)
        // Does NOT touch DIPLOMA COURSES which is at y: 250!
        ctx.save();
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(80, 32, 162, 190);
        ctx.restore();

        // 3. Draw the official UCA Emblem Logo (logo2.png)
        // Center: cx = 158, cy = 125
        const targetW = 164;
        const targetH = Math.round(targetW * (468 / 533)); // ~144px
        const logoX = 158 - targetW / 2;
        const logoY = 125 - targetH / 2;

        ctx.save();
        ctx.shadowColor = 'rgba(15, 23, 42, 0.18)';
        ctx.shadowBlur = 10;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 3;
        ctx.drawImage(logoPng, logoX, logoY, targetW, targetH);
        ctx.restore();

        // 4. Clean up the 4 Professional Certification Subtitles
        const cleanups = [
          {
            box: { x: 96, y: 520, w: 146, h: 36 },
            line1: 'GST, Billing, Inventory',
            line2: '& Real Accounting'
          },
          {
            box: { x: 298, y: 520, w: 148, h: 36 },
            line1: 'MS Word, Excel, PPT',
            line2: '& Internet Suite'
          },
          {
            box: { x: 96, y: 616, w: 146, h: 36 },
            line1: 'Formulas, Pivot Table',
            line2: '& MIS Reports'
          },
          {
            box: { x: 298, y: 616, w: 168, h: 36 },
            line1: 'Fundamental Skills,',
            line2: 'Typing & Office PC'
          }
        ];

        cleanups.forEach(item => {
          // Erase old garbled text with pure white
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(item.box.x, item.box.y, item.box.w, item.box.h);

          // Draw clean, professional text
          ctx.fillStyle = '#475569';
          ctx.font = '600 12px "Segoe UI", Arial, sans-serif';
          ctx.textAlign = 'left';
          ctx.textBaseline = 'top';
          ctx.fillText(item.line1, item.box.x, item.box.y + 2);
          ctx.fillText(item.line2, item.box.x, item.box.y + 18);
        });

        // 5. Build Pristine Bottom Contact & Address Bar
        // Start bar at y: 654 to cover the old dark blue bar and gold curve
        const barY = 654;
        const barH = 768 - barY; // 114px

        // Draw solid luxury dark navy background
        const barGrad = ctx.createLinearGradient(0, barY, 1376, 768);
        barGrad.addColorStop(0, '#040d25');
        barGrad.addColorStop(0.35, '#071842');
        barGrad.addColorStop(1, '#0b2464');
        ctx.fillStyle = barGrad;
        ctx.fillRect(0, barY, 1376, barH);

        // Gold Top Accent Stripe
        const goldGrad = ctx.createLinearGradient(0, barY, 1376, barY);
        goldGrad.addColorStop(0, '#f59e0b');
        goldGrad.addColorStop(0.5, '#fbbf24');
        goldGrad.addColorStop(1, '#f59e0b');
        ctx.fillStyle = goldGrad;
        ctx.fillRect(0, barY, 1376, 4.5);

        // --- Left Side: Phone & Contact Us ---
        const phoneX = 65;
        const phoneY = barY + barH / 2 + 2;

        ctx.save();
        ctx.beginPath();
        ctx.arc(phoneX, phoneY, 28, 0, Math.PI * 2);
        ctx.fillStyle = '#f59e0b';
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.fillStyle = '#071536';
        ctx.font = '24px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('📞', phoneX, phoneY);
        ctx.restore();

        // "CONTACT US" pill
        ctx.save();
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.roundRect(108, barY + 16, 105, 20, 10);
        ctx.fill();
        ctx.fillStyle = '#071536';
        ctx.font = '900 11.5px "Segoe UI", Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('CONTACT US', 160, barY + 26);
        ctx.restore();

        // Phone Numbers
        ctx.save();
        ctx.fillStyle = '#ffffff';
        ctx.font = '800 24px "Segoe UI", Arial, sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText('+91 89624 69909   |   +91 91657 61919', 108, barY + 68);
        ctx.restore();

        // Vertical Separator
        ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.fillRect(505, barY + 16, 2, barH - 32);

        // --- Right Side: Location Pin & Address ---
        const locX = 545;
        const locY = barY + barH / 2 + 2;

        ctx.save();
        ctx.beginPath();
        ctx.arc(locX, locY, 28, 0, Math.PI * 2);
        ctx.fillStyle = '#f59e0b';
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.fillStyle = '#071536';
        ctx.font = '24px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('📍', locX, locY);
        ctx.restore();

        // "OUR ADDRESS" pill
        ctx.save();
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.roundRect(585, barY + 16, 110, 20, 10);
        ctx.fill();
        ctx.fillStyle = '#071536';
        ctx.font = '900 11.5px "Segoe UI", Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('OUR ADDRESS', 640, barY + 26);
        ctx.restore();

        // Updated Official Address requested by user:
        // Banaras Road, Near Mishra Sweets, RG Tower, Ambikapur, Surguja, Chhattisgarh - 497001
        ctx.save();
        ctx.fillStyle = '#ffffff';
        ctx.font = '700 17.5px "Segoe UI", Arial, sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText('Banaras Road, Near Mishra Sweets, RG Tower,', 585, barY + 54);
        ctx.fillText('Ambikapur, Surguja, Chhattisgarh - 497001', 585, barY + 80);
        ctx.restore();

        statusEl.textContent = 'Banner rendered! Uploading to server...';

        // Auto POST to server on port 8081
        const dataUrl = canvas.toDataURL('image/png', 1.0);
        const resp = await fetch('http://localhost:8081/save-banner', {
          method: 'POST',
          body: dataUrl
        });
        const result = await resp.json();
        if (result.success) {
          statusEl.textContent = 'SUCCESS! New banner saved to assets/banner3.png (' + (result.size / 1024).toFixed(1) + ' KB)';
          window.bannerSavedSuccessfully = true;
        } else {
          statusEl.textContent = 'Save failed: ' + result.error;
        }
      } catch (err) {
        console.error(err);
        statusEl.textContent = 'Error: ' + err.message;
      }
    }

    buildBanner();
  </script>
</body>
</html>
