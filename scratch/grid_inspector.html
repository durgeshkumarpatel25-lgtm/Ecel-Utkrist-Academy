<!DOCTYPE html>
<html>
<head>
  <title>Coordinate Grid Inspector</title>
</head>
<body style="background: #222; margin: 0; padding: 20px;">
  <canvas id="c" width="1376" height="768"></canvas>
  <script>
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');
    const img = new Image();
    img.src = '../assets/banner3.png';
    img.onload = () => {
      ctx.drawImage(img, 0, 0);
      
      // Draw 50px grid
      ctx.strokeStyle = 'rgba(255, 0, 0, 0.4)';
      ctx.lineWidth = 1;
      ctx.font = '10px monospace';
      ctx.fillStyle = 'red';
      for (let x = 0; x < 1376; x += 50) {
        ctx.beginPath();
        ctx.moveTo(x, 0); ctx.lineTo(x, 768);
        ctx.stroke();
        ctx.fillText(x, x + 2, 12);
        ctx.fillText(x, x + 2, 760);
      }
      for (let y = 0; y < 768; y += 50) {
        ctx.beginPath();
        ctx.moveTo(0, y); ctx.lineTo(1376, y);
        ctx.stroke();
        ctx.fillText(y, 4, y - 2);
        ctx.fillText(y, 1340, y - 2);
      }
      window.gridReady = true;
    };
  </script>
</body>
</html>
